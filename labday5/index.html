<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <h1>Các hình có thể tạo được với Border</h1>

      <div class="grid">

        <div class="item">
          <div class="shape square"></div>
          <p>1. Hình vuông</p>
        </div>

        <div class="item">
          <div class="shape rectangle"></div>
          <p>2. Hình chữ nhật</p>
        </div>

        <div class="item">
          <div class="shape tri-up"></div>
          <p>3. Tam giác lên</p>
        </div>

        <div class="item">
          <div class="shape tri-down"></div>
          <p>4. Tam giác xuống</p>
        </div>

        <div class="item">
          <div class="shape tri-left"></div>
          <p>5. Tam giác trái</p>
        </div>

        <div class="item">
          <div class="shape tri-right"></div>
          <p>6. Tam giác phải</p>
        </div>

        <div class="item">
          <div class="shape trapezoid"></div>
          <p>7. Hình thang</p>
        </div>

        <div class="item">
          <div class="shape tri-wide"></div>
          <p>8. Tam giác rộng</p>
        </div>

        <div class="item">
          <div class="shape tri-narrow"></div>
          <p>9. Tam giác nhọn</p>
        </div>

        <div class="item">
          <div class="shape tri-iso"></div>
          <p>10. Tam giác cân</p>
        </div>

        <div class="item">
          <div class="shape arrow-right"></div>
          <p>11. Mũi tên phải</p>
        </div>

        <div class="item">
          <div class="shape arrow-left"></div>
          <p>12. Mũi tên trái</p>
        </div>
  
        <div class="item">
          <div class="shape ribbon"></div>
          <p>13. Ribbon/Lá cờ</p>
        </div>

      </div>
      <div class="f8">
        <div class="f">
          <div class="f-vertical"></div>
          <div class="f-top"></div>
          <div class="f-middle"></div>
        </div>

        <div class="eight">
          <div class="eight-box"></div>
          <div class="eight-middle"></div>
        </div>
        <p class="footer">14. F8</p>
      </div>
  </body>
</html>
